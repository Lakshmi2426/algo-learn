      <stop offset="0%" stop-color="#0C2C6B" />
      <stop offset="100%" stop-color="#1D58D8" />
    </linearGradient>
    <linearGradient id="skullCapGradDark" x1="22" y1="96" x2="96" y2="96" gradientUnits="userSpaceOnUse">
