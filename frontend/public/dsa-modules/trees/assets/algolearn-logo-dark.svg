      <stop offset="25%" stop-color="#6366F1" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="85%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <linearGradient id="collarHighlightGradDark" x1="24" y1="68" x2="94" y2="68" gradientUnits="userSpaceOnUse">
