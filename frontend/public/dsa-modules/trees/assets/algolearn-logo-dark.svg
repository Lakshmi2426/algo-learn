    <filter id="ambientGlowDark" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Graduation Cap Icon (Left) with subtle ambient glow -->
  <g transform="translate(10, 10)" filter="url(#ambientGlowDark)">
