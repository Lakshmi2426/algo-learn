  <!-- Typography (Right) -->
  <g transform="translate(165, 84)">
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="64" letter-spacing="-1.5">
      <tspan fill="#FFFFFF">Algo</tspan><tspan fill="url(#learnGradDark)">Learn</tspan>
    </text>
    <text y="36" x="4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="18" fill="#8E9EB5" letter-spacing="5">
      YOUR DSA JOURNEY
    </text>
  </g>
