<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 160" width="540" height="160" fill="none">
  <defs>
    <linearGradient id="mortarboardGradDark" x1="20" y1="18" x2="118" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#040F28" />
      <stop offset="28%" stop-color="#0A2254" />
      <stop offset="65%" stop-color="#1446A0" />
      <stop offset="100%" stop-color="#1E65FF" />
    </linearGradient>
    <linearGradient id="mortarboardRimGradDark" x1="12" y1="46" x2="124" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="extrusionLeftGradDark" x1="12" y1="46" x2="68" y2="82" gradientUnits="userSpaceOnUse">
