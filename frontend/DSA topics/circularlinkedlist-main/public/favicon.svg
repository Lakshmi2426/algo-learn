<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#60A5FA" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>
  
  <!-- Linear Search Array Grid Representation -->
  <rect x="12" y="36" width="10" height="12" rx="3" fill="#FFFFFF" fill-opacity="0.25" stroke="#FFFFFF" stroke-width="1.5"/>
  <rect x="24" y="36" width="10" height="12" rx="3" fill="#FFFFFF" fill-opacity="0.25" stroke="#FFFFFF" stroke-width="1.5"/>
  <rect x="36" y="36" width="10" height="12" rx="3" fill="#60A5FA" stroke="#FFFFFF" stroke-width="2"/>
  
  <!-- Target Pointer / Search Lens -->
  <circle cx="41" cy="22" r="9" stroke="#FFFFFF" stroke-width="2.5" fill="none" filter="url(#glow)"/>
  <line x1="47.5" y1="28.5" x2="54" y2="35" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="41" cy="22" r="3.5" fill="#FBBF24"/>
</svg>
